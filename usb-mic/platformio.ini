[platformio]
default_envs = prepare-bluedroid, m5stack-stopwatch-usb-mic
core_dir = .pio-core
boards_dir = boards
src_dir = ../src
include_dir = ../include

; USB Audio Class first shipped after the Arduino-ESP32 2.0.17 core used by
; the stable dashboard image. Keep this build and its package cache isolated so
; switching variants cannot replace the stable environment's framework.
[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = m5stack-stopwatch-usb-mic
framework = arduino
extra_scripts =
  pre:add_bluedroid_api.py
  pre:../scripts/patch_m5gfx_amoled_sleep.py

; Arduino-ESP32 3.x defaults to NimBLE. Codex Desktop opens the vendor HID
; output report immediately after discovery, so this variant deliberately
; rebuilds the framework with the same Bluedroid/legacy BLE API used by the
; stable firmware.
custom_sdkconfig =
  CONFIG_BT_BLUEDROID_ENABLED=y
  CONFIG_BT_NIMBLE_ENABLED=n
  CONFIG_BT_CLASSIC_ENABLED=n
  CONFIG_BT_BLE_50_FEATURES_SUPPORTED=n
  CONFIG_BT_BLE_42_FEATURES_SUPPORTED=y
  CONFIG_BT_BLE_SMP_ENABLE=y

board_build.partitions = partitions/default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
upload_speed = 1500000
lib_deps =
  M5Unified = https://github.com/m5stack/M5Unified.git#4fb444784c85791e0b0207701392b42be234b2e7
  M5GFX = https://github.com/m5stack/M5GFX.git#729297d6e3d657ddc1ec5189bac2f2ea68828085
  M5PM1 = https://github.com/m5stack/M5PM1.git#be9a5456c007c333e7ac963f33bfde1ffa5d82ee
  M5IOE1 = https://github.com/m5stack/M5IOE1.git#846eec7d05e25c09013be2acdb8804487f48a62e
  bblanchon/ArduinoJson @ ^6.21.5
build_flags =
  -DESP32S3
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=1
  -DCODEX_STOPWATCH_TASK_NOTIFICATIONS=1

; First pass: pioarduino creates the custom Bluedroid ESP-IDF libraries without
; attempting to build TinyUSB as an ESP-IDF component. `pio run` executes this
; environment before the microphone image below.
[env:prepare-bluedroid]

[env:m5stack-stopwatch-usb-mic]
extra_scripts =
  ${env.extra_scripts}
  pre:../scripts/patch_m5unified_mic_dc_servo.py
build_flags =
  ${env.build_flags}
  -DCODEX_STOPWATCH_USB_MIC=1
  ; M5Unified's fixed 1/32-per-sample DC servo creates an extra ~121 Hz
  ; high-pass corner at this image's 48 kHz sample rate. The dependency patch
  ; makes this macro USB-mic-specific; other M5Unified builds keep upstream
  ; behavior while the ES8311 hardware dynamic HPF remains enabled.
  -DCODEX_STOPWATCH_DISABLE_M5_MIC_DC_SERVO=1
  -DCONFIG_TINYUSB_ENABLED=1
  -DCONFIG_TINYUSB_AUDIO_ENABLED=1

  ; The retained Arduino TinyUSB archive contains all class dispatchers. These
  ; switches keep that prebuilt archive linkable, while the application creates
  ; only Arduino-ESP32's standard UAC1 microphone interface. No speaker or
  ; other USB class is advertised.
  -DCONFIG_TINYUSB_HID_ENABLED=1
  -DCONFIG_TINYUSB_HID_BUFSIZE=64
  -DCONFIG_TINYUSB_MSC_ENABLED=1
  -DCONFIG_TINYUSB_MSC_BUFSIZE=4096
  -DCONFIG_TINYUSB_DFU_ENABLED=1
  -DCONFIG_TINYUSB_DFU_BUFSIZE=4096
  -DCONFIG_TINYUSB_DFU_RT_ENABLED=1
  -DCONFIG_TINYUSB_NCM_ENABLED=1
  -Wl,--wrap=tinyusb_add_string_descriptor

; Deterministic capture source for transport/timing validation. It inherits
; the production descriptors and pipeline but never reads the physical mic.
; Keep it out of default_envs so a normal install cannot flash this test image
; by accident.
[env:m5stack-stopwatch-usb-mic-synthetic]
extends = env:m5stack-stopwatch-usb-mic
build_flags =
  ${env:m5stack-stopwatch-usb-mic.build_flags}
  -DCODEX_STOPWATCH_USB_MIC_SYNTHETIC=1

; Explicitly selected Home-only IMU trial. The normal release stays unchanged.
[env:m5stack-stopwatch-home-imu]
extends = env:m5stack-stopwatch-usb-mic
build_flags =
  ${env:m5stack-stopwatch-usb-mic.build_flags}
  -DCODEX_STOPWATCH_HOME_IMU=1
